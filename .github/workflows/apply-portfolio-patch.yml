name: Publish portfolio patch

on:
  push:
    paths:
      - ".portfolio_patch_ready"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and apply portfolio patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, pathlib
          root = pathlib.Path(".")
          data = "".join((root / f".portfolio_patch_part{i:02d}").read_text().strip() for i in range(4))
          patch = gzip.decompress(base64.b64decode(data))
          pathlib.Path("/tmp/portfolio.patch").write_bytes(patch)
          PY
          git apply --binary /tmp/portfolio.patch
      - name: Commit published portfolio
        shell: bash
        run: |
          rm -f .portfolio_patch_part00 .portfolio_patch_part01 .portfolio_patch_part02 .portfolio_patch_part03 .portfolio_patch_ready
          rm -f .github/workflows/apply-portfolio-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish recruiter portfolio with AI challenge"
          git push origin HEAD:main
